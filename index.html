<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Karla:ital,wght@0,200..800;1,200..800&family=Maven+Pro:wght@400..900&family=Orbitron:wght@400..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
</head>


<body>

    <main class="flex-column-container">
        <header>
            <div id="theme-container">
                <label for="theme-select" class="sec-text karla-text">Select Theme</label>
                <select name="theme" id="theme-select">
                    <option value="dark-theme">Dark</option>
                    <option value="light-theme">Light</option>
                </select>
            </div>

            <h1 class="main-text karla-text"> <span id="main-text-word">Generate</span> a random password</h1>
            <p class="sec-text karla-text"> Never use a insecure password again</p>
        </header>
        <div class="selector-container">
            <label for="pass-length" class="sec-text karla-text">Enter a number between (8 and 20)</label>
            <input type="number" id="pass-length" name="pass-length" min="8" max="20" value="12"
                class="number-input karla-text">
        </div>
        <div class="btn-container">
            <button class="main-btn" onclick="generatePasswords()">Generate Passwords</button>
        </div>
        <div>
            <hr>
        </div>
        <div class="pass-container">
            <input id="pass-1" type="text" class="sec-text  field-text karla-text" placeholder="password" readonly>
            <input id="pass-2" type="text" class="sec-text  field-text karla-text" placeholder="password" readonly>
        </div>

        <hr>

        <script src="index.js"></script>

    </main>
</body>

</html>
